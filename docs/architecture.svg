<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 810" width="1270" height="810" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Badminton Résas : architecture</title>
  <desc id="d">Les joueurs utilisent le site Next.js hébergé sur Vercel, qui s'appuie sur Supabase (Auth, Postgres, Realtime, Storage), envoie des e-mails par Gmail et des messages WhatsApp par Green API. GitHub déploie le site à chaque push.</desc>
  <defs>
    <style>
      .bg{fill:var(--d-bg,#f6f7f5)}
      .ttl{font-size:22px;font-weight:600;fill:var(--d-ink,#18201b)}
      .sub{font-size:13px;fill:var(--d-muted,#5b665f)}
      .box{fill:var(--d-card,#ffffff);stroke-width:1.5}
      .inner{fill:var(--d-inner,#f1f4f1);stroke:var(--d-line,#cfd6d0);stroke-width:1}
      .h{font-size:16px;font-weight:600}
      .n{font-size:13.5px;font-weight:600;fill:var(--d-ink,#18201b)}
      .s{font-size:11.5px;fill:var(--d-muted,#5b665f)}
      .m{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;fill:var(--d-muted,#5b665f)}
      .lab{font-size:11.5px;fill:var(--d-ink,#18201b)}
      .lab2{font-size:11px;fill:var(--d-muted,#5b665f)}
      .wire{fill:none;stroke:var(--d-wire,#6b766f);stroke-width:1.6}
      .gap{fill:none;stroke:var(--d-bg,#f6f7f5);stroke-width:7}
      .dash{stroke-dasharray:6 5}
      .ah{fill:var(--d-wire,#6b766f)}
      .c-user{stroke:var(--d-user,#4757b8)} .t-user{fill:var(--d-user,#4757b8)}
      .c-vercel{stroke:var(--d-ink,#18201b)} .t-vercel{fill:var(--d-ink,#18201b)}
      .c-supa{stroke:var(--d-supa,#1f9d63)} .t-supa{fill:var(--d-supa,#1f9d63)}
      .c-mail{stroke:var(--d-mail,#c2493a)} .t-mail{fill:var(--d-mail,#c2493a)}
      .c-wa{stroke:var(--d-wa,#0f8a83)} .t-wa{fill:var(--d-wa,#0f8a83)}
      .c-git{stroke:var(--d-git,#6a5a8c)} .t-git{fill:var(--d-git,#6a5a8c)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1270" height="810"/>
  <text class="ttl" x="30" y="44">Badminton Résas : architecture</text>
  <text class="sub" x="30" y="66">Qui parle à qui quand un joueur réserve, s'inscrit ou consulte les comptes</text>

  <!-- GitHub -->
  <rect class="box c-git" x="380" y="88" width="240" height="58" rx="8"/>
  <text class="h t-git" x="396" y="112">GitHub</text>
  <text class="m" x="396" y="132">feranti/Badminton_Reservation</text>

  <!-- Liens de fond : e-mail de connexion, puis déploiement par-dessus -->
  <path class="wire" d="M940,210 V172 H140 V244" marker-end="url(#a)"/>
  <text class="lab" x="160" y="164">e-mail de connexion : lien + code à 6 chiffres</text>
  <path class="gap" d="M500,166 V178"/>
  <path class="wire" d="M500,146 V204" marker-end="url(#a)"/>
  <text class="lab2" x="510" y="196">chaque push déploie le site</text>

  <!-- Joueurs -->
  <rect class="box c-user" x="30" y="250" width="220" height="230" rx="10"/>
  <text class="h t-user" x="48" y="278">Joueurs</text>
  <text class="s" x="48" y="300">navigateur ou téléphone</text>
  <text class="s" x="48" y="316">(icône sur l'écran d'accueil)</text>
  <text class="lab" x="48" y="350">• réservent des terrains</text>
  <text class="lab" x="48" y="372">• s'inscrivent aux sessions</text>
  <text class="lab" x="48" y="394">• ajoutent les QR codes</text>
  <text class="lab" x="48" y="416">• suivent les comptes</text>
  <text class="lab" x="58" y="438">en direct</text>

  <!-- Joueurs ↔ Vercel -->
  <path class="wire" d="M256,372 H314" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lab" x="285" y="362" text-anchor="middle">HTTPS</text>

  <!-- Vercel -->
  <rect class="box c-vercel" x="320" y="210" width="360" height="330" rx="10"/>
  <text class="h t-vercel" x="338" y="238">Vercel · Next.js 16</text>
  <text class="m" x="338" y="258">bad-resas.vercel.app</text>
  <rect class="inner" x="336" y="276" width="328" height="44" rx="6"/>
  <text class="n" x="348" y="295">proxy.ts</text>
  <text class="s" x="348" y="311">rafraîchit la session, renvoie vers /login</text>
  <rect class="inner" x="336" y="328" width="328" height="44" rx="6"/>
  <text class="n" x="348" y="347">Pages (rendues sur le serveur)</text>
  <text class="s" x="348" y="363">accueil, sessions, comptes, profil</text>
  <rect class="inner" x="336" y="380" width="328" height="44" rx="6"/>
  <text class="n" x="348" y="399">Server Actions</text>
  <text class="s" x="348" y="415">réserver, s'inscrire, payer, rembourser</text>
  <rect class="inner" x="336" y="440" width="160" height="84" rx="6"/>
  <text class="n" x="348" y="460">E-mail</text>
  <text class="s" x="348" y="477">liste d'attente :</text>
  <text class="s" x="348" y="492">place libérée</text>
  <text class="m" x="348" y="512">nodemailer</text>
  <rect class="inner" x="504" y="440" width="160" height="84" rx="6"/>
  <text class="n" x="516" y="460">Message WhatsApp</text>
  <text class="s" x="516" y="477">terrain réservé,</text>
  <text class="s" x="516" y="492">annulé ou supprimé</text>
  <text class="m" x="516" y="512">after()</text>

  <!-- Vercel ↔ Supabase -->
  <path class="wire" d="M686,372 H854" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lab" x="770" y="338" text-anchor="middle">API Supabase</text>
  <text class="lab2" x="770" y="356" text-anchor="middle">clé publique + jeton du joueur</text>
  <text class="lab2" x="770" y="392" text-anchor="middle">règles d'accès (RLS)</text>
  <text class="lab2" x="770" y="408" text-anchor="middle">clé secrète : adresses e-mail</text>
  <text class="lab2" x="770" y="424" text-anchor="middle">des joueurs à prévenir</text>

  <!-- Supabase -->
  <rect class="box c-supa" x="860" y="210" width="380" height="330" rx="10"/>
  <text class="h t-supa" x="878" y="238">Supabase</text>
  <text class="s" x="878" y="258">projet « Badminton Reservations »</text>
  <rect class="inner" x="876" y="276" width="348" height="44" rx="6"/>
  <text class="n" x="888" y="295">Auth</text>
  <text class="s" x="888" y="311">connexion par lien ou code, joueurs invités seulement</text>
  <rect class="inner" x="876" y="328" width="348" height="58" rx="6"/>
  <text class="n" x="888" y="347">Postgres</text>
  <text class="s" x="888" y="363">sessions, réservations, inscriptions, remboursements</text>
  <text class="s" x="888" y="378">vue « balances » : qui doit combien à qui</text>
  <rect class="inner" x="876" y="394" width="348" height="44" rx="6"/>
  <text class="n" x="888" y="413">Realtime</text>
  <text class="s" x="888" y="429">prévient les pages ouvertes à chaque changement</text>
  <rect class="inner" x="876" y="446" width="348" height="62" rx="6"/>
  <text class="n" x="888" y="465">Storage</text>
  <text class="s" x="888" y="481">dossier privé « qr-codes »</text>
  <text class="s" x="888" y="496">QR des terrains, liens valables 1 h</text>

  <!-- Bas : services externes -->
  <path class="wire" d="M416,540 V614" marker-end="url(#a)"/>
  <rect class="box c-mail" x="316" y="620" width="200" height="80" rx="8"/>
  <text class="h t-mail" x="332" y="646">Gmail (SMTP)</text>
  <text class="s" x="332" y="666">mot de passe d'application</text>
  <text class="m" x="332" y="686">SMTP_HOST, SMTP_USER…</text>
  <path class="wire" d="M316,660 H180 V486" marker-end="url(#a)"/>
  <text class="lab2" x="248" y="652" text-anchor="middle">place libérée</text>

  <path class="wire" d="M584,540 V614" marker-end="url(#a)"/>
  <rect class="box c-wa" x="540" y="620" width="244" height="80" rx="8"/>
  <text class="h t-wa" x="556" y="646">Green API</text>
  <text class="s" x="556" y="666">garde la connexion WhatsApp</text>
  <text class="m" x="556" y="686">GREEN_API_*, WHATSAPP_GROUP_ID</text>
  <path class="wire" d="M784,660 H854" marker-end="url(#a)"/>
  <text class="lab2" x="819" y="652" text-anchor="middle">envoi</text>
  <rect class="box c-wa" x="860" y="620" width="190" height="80" rx="8"/>
  <text class="h t-wa" x="876" y="646">Groupe WhatsApp</text>
  <text class="s" x="876" y="666">du club : terrains et</text>
  <text class="s" x="876" y="682">places restantes</text>

  <!-- Navigateur ↔ Supabase en direct -->
  <path class="wire" d="M90,486 V770 H1150 V546" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lab" x="300" y="762">en direct depuis le navigateur, avec le jeton du joueur : abonnement temps réel (WebSocket) et envoi des photos de QR codes</text>
</svg>
