<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 840" width="1270" height="840" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Badminton Résas : architecture</title>
  <desc id="d">Les joueurs utilisent le site Next.js hébergé sur un VPS : Traefik reçoit les requêtes HTTPS, Dokploy lance les conteneurs, le site interroge en SQL la base Postgres 17 du même VPS, au nom du joueur connecté, et reçoit ses signaux de modification pour le temps réel. Le site envoie les e-mails par Gmail (SMTP) et les messages WhatsApp par Green API. À chaque push sur main, GitHub Actions construit l'image Docker, la publie sur GHCR et appelle le webhook de Dokploy, qui télécharge alors l'image depuis GHCR et remplace le conteneur du site ; les tâches planifiées de GitHub appellent aussi le site. L'ancienne adresse Vercel ne fait plus que renvoyer vers le nouveau site.</desc>
  <defs>
    <style>
      .bg{fill:var(--d-bg,#f6f7f5)}
      .ttl{font-size:22px;font-weight:600;fill:var(--d-ink,#18201b)}
      .sub{font-size:13px;fill:var(--d-muted,#5b665f)}
      .box{fill:var(--d-card,#ffffff);stroke-width:1.5}
      .vps{fill:var(--d-vps,#fbfcfb);stroke-width:1.8}
      .cont{fill:var(--d-card,#ffffff);stroke-width:1.3}
      .inner{fill:var(--d-inner,#f1f4f1);stroke:var(--d-line,#cfd6d0);stroke-width:1}
      .h{font-size:16px;font-weight:600}
      .h2{font-size:14.5px;font-weight:600}
      .n{font-size:13.5px;font-weight:600;fill:var(--d-ink,#18201b)}
      .s{font-size:11.5px;fill:var(--d-muted,#5b665f)}
      .m{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;fill:var(--d-muted,#5b665f)}
      .lab{font-size:11.5px;fill:var(--d-ink,#18201b)}
      .lab2{font-size:11px;fill:var(--d-muted,#5b665f)}
      .wire{fill:none;stroke:var(--d-wire,#6b766f);stroke-width:1.6}
      .dash{stroke-dasharray:6 5}
      .gap{fill:none;stroke:var(--d-bg,#f6f7f5);stroke-width:7}
      .stp{fill:var(--d-git,#6a5a8c)}
      .stpt{font-size:10.5px;font-weight:700;fill:var(--d-card,#ffffff);text-anchor:middle}
      .ah{fill:var(--d-wire,#6b766f)}
      .c-user{stroke:var(--d-user,#4757b8)} .t-user{fill:var(--d-user,#4757b8)}
      .c-vps{stroke:var(--d-ink,#18201b)} .t-vps{fill:var(--d-ink,#18201b)}
      .c-db{stroke:var(--d-db,#1f9d63)} .t-db{fill:var(--d-db,#1f9d63)}
      .c-mail{stroke:var(--d-mail,#c2493a)} .t-mail{fill:var(--d-mail,#c2493a)}
      .c-wa{stroke:var(--d-wa,#0f8a83)} .t-wa{fill:var(--d-wa,#0f8a83)}
      .c-git{stroke:var(--d-git,#6a5a8c)} .t-git{fill:var(--d-git,#6a5a8c)}
      .c-old{stroke:var(--d-muted,#5b665f)} .t-old{fill:var(--d-muted,#5b665f)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1270" height="840"/>
  <text class="ttl" x="30" y="44">Badminton Résas : architecture</text>
  <text class="sub" x="30" y="66">Qui parle à qui quand un joueur réserve, s'inscrit ou consulte les comptes</text>

  <!-- Ancienne adresse Vercel -->
  <rect class="box c-old dash" x="30" y="90" width="240" height="92" rx="8"/>
  <text class="h t-old" x="46" y="113">Vercel (ancienne adresse)</text>
  <text class="m" x="46" y="132">bad-resas.vercel.app</text>
  <text class="s" x="46" y="150">annonce le déménagement, puis</text>
  <text class="s" x="46" y="166">renvoie vers la même page du site</text>
  <path class="wire dash" d="M140,284 V188" marker-end="url(#a)"/>
  <text class="lab2" x="150" y="240">ancien favori</text>

  <!-- GitHub -->
  <rect class="box c-git" x="330" y="90" width="300" height="92" rx="8"/>
  <text class="h t-git" x="346" y="113">GitHub</text>
  <text class="m" x="346" y="132">feranti/Badminton_Reservation</text>
  <text class="s" x="346" y="150">Actions : check sur chaque PR, image à chaque</text>
  <text class="s" x="346" y="166">push sur main, tâches planifiées</text>

  <!-- GHCR -->
  <rect class="box c-git" x="760" y="90" width="240" height="92" rx="8"/>
  <text class="h t-git" x="776" y="113">GHCR</text>
  <text class="s" x="776" y="132">registre d'images (privé)</text>
  <text class="s" x="776" y="150">Next.js standalone</text>
  <text class="s" x="776" y="166">latest + sha-…, 10 versions</text>
  <path class="wire" d="M630,130 H754" marker-end="url(#a)"/>
  <circle class="stp" cx="648" cy="117" r="7"/><text class="stpt" x="648" y="121">1</text>
  <text class="lab2" x="660" y="121">publie l'image</text>

  <!-- Joueurs -->
  <rect class="box c-user" x="30" y="290" width="220" height="240" rx="10"/>
  <text class="h t-user" x="48" y="318">Joueurs</text>
  <text class="s" x="48" y="340">navigateur ou téléphone</text>
  <text class="s" x="48" y="356">(icône sur l'écran d'accueil)</text>
  <text class="lab" x="48" y="390">• réservent des terrains</text>
  <text class="lab" x="48" y="412">• s'inscrivent aux sessions</text>
  <text class="lab" x="48" y="434">• ajoutent les QR codes</text>
  <text class="lab" x="48" y="456">• suivent les comptes</text>
  <text class="lab" x="58" y="478">en direct</text>

  <!-- Joueurs ↔ Traefik -->
  <path class="wire" d="M256,445 H310" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lab" x="276" y="435" text-anchor="middle">HTTPS</text>

  <!-- VPS -->
  <rect class="vps c-vps" x="300" y="250" width="940" height="420" rx="12"/>
  <text class="h t-vps" x="318" y="276">VPS · Dokploy (Docker)</text>

  <!-- Déploiement : 1 image publiée, 2 webhook, 3 Dokploy télécharge l'image, 4 remplace le conteneur -->
  <path class="wire dash" d="M380,182 V316" marker-end="url(#a)"/>
  <circle class="stp" cx="364" cy="214" r="7"/><text class="stpt" x="364" y="218">2</text>
  <text class="lab2" x="372" y="236" text-anchor="end">webhook :</text>
  <text class="lab2" x="372" y="250" text-anchor="end">« déploie latest »</text>
  <path class="wire" d="M880,182 V200 H450 V316" marker-end="url(#a)"/>
  <circle class="stp" cx="700" cy="191" r="7"/><text class="stpt" x="700" y="195">3</text>
  <text class="lab2" x="712" y="195">Dokploy télécharge l'image</text>
  <path class="gap" d="M560,194 V206"/>
  <path class="wire" d="M560,182 V284" marker-end="url(#a)"/>
  <text class="lab2" x="570" y="218">tâches planifiées : rappel 72 h</text>
  <text class="lab2" x="570" y="232">(toutes les 6 h), récap du lundi</text>
  <text class="m" x="570" y="246">HTTPS + CRON_SECRET</text>

  <rect class="inner" x="316" y="322" width="150" height="70" rx="6"/>
  <text class="n" x="328" y="342">Dokploy</text>
  <circle class="stp" cx="333" cy="355" r="7"/><text class="stpt" x="333" y="359">4</text>
  <text class="s" x="345" y="359">remplace le site</text>
  <text class="s" x="328" y="375">par la nouvelle image</text>
  <path class="wire" d="M466,357 H484" marker-end="url(#a)"/>

  <rect class="inner" x="316" y="410" width="150" height="70" rx="6"/>
  <text class="n" x="328" y="430">Traefik</text>
  <text class="s" x="328" y="447">HTTPS, nom de domaine</text>
  <text class="s" x="328" y="463">vers le conteneur</text>
  <path class="wire" d="M466,445 H484" marker-end="url(#a)"/>

  <!-- Conteneur Next.js -->
  <rect class="cont c-vps" x="490" y="290" width="370" height="360" rx="8"/>
  <text class="h2 t-vps" x="502" y="311">Next.js 16 · conteneur du site</text>

  <rect class="inner" x="502" y="322" width="346" height="38" rx="6"/>
  <text class="n" x="514" y="339">proxy.ts</text>
  <text class="s" x="514" y="354">renvoie vers /login un visiteur sans session</text>
  <rect class="inner" x="502" y="365" width="346" height="38" rx="6"/>
  <text class="n" x="514" y="382">Pages (rendues sur le serveur)</text>
  <text class="s" x="514" y="397">accueil, sessions, comptes, profil, connexion</text>
  <rect class="inner" x="502" y="408" width="346" height="38" rx="6"/>
  <text class="n" x="514" y="425">Server Actions</text>
  <text class="s" x="514" y="440">réserver, s'inscrire, payer, rembourser</text>
  <rect class="inner" x="502" y="451" width="346" height="38" rx="6"/>
  <text class="n" x="514" y="468">/api/changements</text>
  <text class="s" x="514" y="483">temps réel : recharge les pages ouvertes (SSE)</text>
  <rect class="inner" x="502" y="494" width="346" height="38" rx="6"/>
  <text class="n" x="514" y="511">/api/qr</text>
  <text class="s" x="514" y="526">images des QR codes, joueurs connectés seulement</text>
  <rect class="inner" x="502" y="537" width="346" height="38" rx="6"/>
  <text class="n" x="514" y="554">/api/cron/…</text>
  <text class="s" x="514" y="569">rappel des terrains vides, récap des comptes</text>

  <rect class="inner" x="502" y="582" width="168" height="58" rx="6"/>
  <text class="n" x="514" y="600">E-mail</text>
  <text class="s" x="514" y="616">connexion, place libérée</text>
  <text class="m" x="514" y="632">nodemailer</text>
  <rect class="inner" x="680" y="582" width="168" height="58" rx="6"/>
  <text class="n" x="692" y="600">Message WhatsApp</text>
  <text class="s" x="692" y="616">terrains, inscriptions…</text>
  <text class="m" x="692" y="632">after()</text>

  <!-- Next.js ↔ Postgres -->
  <path class="wire" d="M866,400 H954" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lab" x="910" y="390" text-anchor="middle">SQL</text>
  <text class="lab2" x="910" y="418" text-anchor="middle">resas_app,</text>
  <text class="lab2" x="910" y="432" text-anchor="middle">au nom du joueur</text>
  <text class="m" x="910" y="448" text-anchor="middle">DATABASE_URL</text>
  <path class="wire" d="M960,607 H910 V470 H866" marker-end="url(#a)"/>
  <text class="lab2" x="935" y="598" text-anchor="middle">LISTEN</text>

  <!-- Postgres -->
  <rect class="cont c-db" x="960" y="290" width="264" height="360" rx="8"/>
  <text class="h2 t-db" x="972" y="311">Postgres 17</text>
  <text class="s" x="1062" y="311">sans port ouvert sur Internet</text>

  <rect class="inner" x="972" y="322" width="240" height="52" rx="6"/>
  <text class="n" x="984" y="339">Données</text>
  <text class="s" x="984" y="354">sessions, réservations,</text>
  <text class="s" x="984" y="368">inscriptions, remboursements</text>
  <rect class="inner" x="972" y="380" width="240" height="38" rx="6"/>
  <text class="n" x="984" y="397">Vue « balances »</text>
  <text class="s" x="984" y="412">qui doit combien à qui</text>
  <rect class="inner" x="972" y="424" width="240" height="38" rx="6"/>
  <text class="n" x="984" y="441">Règles d'accès (RLS)</text>
  <text class="s" x="984" y="456">appliquées au joueur connecté</text>
  <rect class="inner" x="972" y="468" width="240" height="38" rx="6"/>
  <text class="n" x="984" y="485">qr_images</text>
  <text class="s" x="984" y="500">photos des QR codes des terrains</text>
  <rect class="inner" x="972" y="512" width="240" height="52" rx="6"/>
  <text class="n" x="984" y="529">Connexion</text>
  <text class="m" x="984" y="544">login_tokens, auth_sessions</text>
  <text class="s" x="984" y="558">lisibles par le serveur seul</text>
  <rect class="inner" x="972" y="570" width="240" height="66" rx="6"/>
  <text class="n" x="984" y="587">pg_notify</text>
  <text class="s" x="984" y="602">signale chaque modification</text>
  <text class="s" x="984" y="616">des tables affichées</text>

  <!-- Bas : services externes -->
  <path class="wire" d="M586,640 V720" marker-end="url(#a)"/>
  <rect class="box c-mail" x="470" y="726" width="230" height="80" rx="8"/>
  <text class="h t-mail" x="486" y="752">Gmail (SMTP)</text>
  <text class="s" x="486" y="772">mot de passe d'application</text>
  <text class="m" x="486" y="792">SMTP_HOST, SMTP_USER…</text>
  <path class="wire" d="M470,766 H140 V536" marker-end="url(#a)"/>
  <text class="lab" x="305" y="758" text-anchor="middle">connexion : lien + code à 8 chiffres</text>
  <text class="lab2" x="305" y="782" text-anchor="middle">liste d'attente : une place s'est libérée</text>

  <path class="wire" d="M764,640 V720" marker-end="url(#a)"/>
  <rect class="box c-wa" x="740" y="726" width="244" height="80" rx="8"/>
  <text class="h t-wa" x="756" y="752">Green API</text>
  <text class="s" x="756" y="772">garde la connexion WhatsApp</text>
  <text class="m" x="756" y="792">GREEN_API_*, WHATSAPP_GROUP_ID</text>
  <path class="wire" d="M984,766 H1024" marker-end="url(#a)"/>
  <text class="lab2" x="1004" y="758" text-anchor="middle">envoi</text>
  <rect class="box c-wa" x="1030" y="726" width="210" height="80" rx="8"/>
  <text class="h t-wa" x="1046" y="752">Groupe WhatsApp</text>
  <text class="s" x="1046" y="772">terrains, inscriptions, rappel</text>
  <text class="s" x="1046" y="788">à 72 h, récap du lundi soir</text>
</svg>
