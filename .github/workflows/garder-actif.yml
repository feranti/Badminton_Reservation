# Empêche GitHub de désactiver les tâches planifiées après 60 jours sans commit sur le dépôt.
# Chaque semaine, ce workflow réactive par l'API les workflows planifiés (lui compris) : la
# réactivation remet à zéro le compteur d'inactivité, sans commit ni secret à créer.
name: Garder les tâches planifiées actives

on:
  schedule:
    - cron: "23 4 * * 0" # chaque dimanche à 4 h 23 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  reactiver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Réactiver les workflows planifiés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in garder-actif.yml rappel-terrains-vides.yml recap-comptes.yml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
            echo "${workflow} : actif"
          done
